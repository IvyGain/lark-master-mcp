name = "lark-master-webhook"
main = "src/index.ts"
compatibility_date = "2024-12-01"
node_compat = true

# Production worker
[env.production]
workers_dev = false

# Development worker
[env.development]
workers_dev = true

# KV Namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "preview_id"
preview_id = "preview_id"

# Durable Objects
[[durable_objects.bindings]]
name = "CONVERSATION"
class_name = "ConversationDO"

# Migrations (for Durable Objects)
[[migrations]]
tag = "v1"
new_classes = ["ConversationDO"]

# Secrets (set with: wrangler secret put <NAME>)
# - LARK_APP_ID
# - LARK_APP_SECRET
# - LARK_VERIFICATION_TOKEN
# - LARK_ENCRYPT_KEY
# - BRAIN_URL
